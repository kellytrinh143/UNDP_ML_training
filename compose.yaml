services:
  app:
    build: .
    image: ml:dev
    working_dir: /workspace
    environment:
      - DATA_ROOT=/data
      - OUTPUT_ROOT=/output
    volumes:
      - .:/workspace
      - ./data:/data
      - ./outputs:/output
    command: sleep infinity
    tty: true
    stdin_open: true

  jupyter:
    build: .
    image: ml:dev
    working_dir: /workspace
    environment:
      - DATA_ROOT=/data
      - OUTPUT_ROOT=/output
    volumes:
      - .:/workspace
      - ./data:/data
      - ./outputs:/output
    ports:
      - "8889:8888"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --notebook-dir=/workspace
      --ServerApp.token=''
      --ServerApp.password=''
